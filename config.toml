baseurl = "https://maoxunxing.com/"
title = "maoxunxing"
theme = "hugo-coder"
languagecode = "zh-CN"
defaultcontentlanguage = "zh-CN"
defaultcontentlanguageinsubdir = true
canonifyurls = false
timeout = 120000
googleAnalytics = "UA-199510588-1"
enableRobotsTXT = true
buildFuture = true
pygmentsstyle = "colorful"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

[pagination]
  pagerSize = 10
  path = "page"

[languages]
  [languages.zh-CN]
    weight = 1
    languageName = "CN"
    title = "毛毛星 Momo - AI 全栈、harness 与独立产品"
    [languages.zh-CN.params]
      icon = "1"
      description = "毛毛星的个人枢纽：AI 全栈、harness 与独立产品。小工具从这里进入，CrossAgent Lab 是垂直产品。"
      keywords = "毛毛星,Momo,maoxunxing,AI全栈,harness,独立产品,AI创作者,AI编程,独立开发,小工具,CrossAgent,长期投资"
      custom_css = ["/css/main.css?v=20261023-toc", "/css/code-dark.css?v=20260626a", "/css/home.css?v=20261017-rss", "/css/prompts.css?v=20260626a", "/css/p0-fixes.css?v=20260626a", "/css/nav-hotfix.css?v=20261017-rss", "/css/projects.css?v=20261017-rss", "/css/series.css?v=20260709a", "/css/article-blocks.css?v=20261017-rss", "/css/hub-b.css?v=20261017-rss"]
      custom_js = ["/js/home-dots-simplex.js?v=20260710b", "/js/code-copy.js?v=20260713a"]
  [languages.en]
    languageName = "EN"
    weight = 2
    title = "Momo - AI Full-Stack, Harness, and Indie Products"
    [languages.en.params]
      description = "Momo's hub for AI full-stack work, harnesses, and indie products. Open small tools here. CrossAgent Lab is the vertical product."
      keywords = "Momo,maoxunxing,AI full-stack,harness,indie products,AI creator,AI coding,indie hacker,small tools,CrossAgent,long-term investing"
      custom_css = ["/css/main.css?v=20261023-toc", "/css/code-dark.css?v=20260626a", "/css/home.css?v=20261017-rss", "/css/prompts.css?v=20260626a", "/css/p0-fixes.css?v=20260626a", "/css/nav-hotfix.css?v=20261017-rss", "/css/projects.css?v=20261017-rss", "/css/series.css?v=20260709a", "/css/article-blocks.css?v=20261017-rss", "/css/hub-b.css?v=20261017-rss"]
      custom_js = ["/js/home-dots-simplex.js?v=20260710b", "/js/code-copy.js?v=20260713a"]

[markup]
  [markup.highlight]
    style = "github"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
