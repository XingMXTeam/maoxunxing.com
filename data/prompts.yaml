    summary_en: "Forces rigorous counter-arguments, falsifiable data, and position-reduction triggers instead of confirming your bias."
    tags_zh: ["投资", "反方检查", "风险管理"]
    tags_en: ["Investing", "Devil's Advocate", "Risk"]
