  - id: talking-head-video-script
    category: media
    stage: "口播脚本"
    stage_en: "Video Script"
    featured: true
    short: false
    title_zh: "自然口播短视频脚本 & 分镜生成（45–90s）"
    title_en: "Natural Talking-Head Video Script & Shot List (45–90s)"
    summary_zh: "拒绝把文章念出来！按「3 秒冲突 Hook → 证据画面 → 大白话解释 → 核心数据 → 个人判断」生成可直接上提词器的分镜脚本。"
    summary_en: "Turns any topic into a conversational 45–90s vertical video script + shot list: 3s conflict hook, screen evidence, plain explanation, and personal call."
    tags_zh: ["口播脚本", "分镜", "短视频"]
    tags_en: ["Video Script", "Storyboard", "Short Video"]
    vars:
      - key_zh: "视频选题"
        key_en: "video topic"
        label_zh: "短视频选题与核心素材"
        label_en: "Video topic and source facts"
        default_zh: "为什么很多 AI Coding Agent 跑完测试还是会把项目改坏？"
        default_en: "Why AI coding agents still break production even when unit tests pass"
      - key_zh: "目标时长"
        key_en: "duration"
        label_zh: "目标时长（如 60 秒）"
        label_en: "Target duration (e.g. 60s)"
        default_zh: "60 秒"
        default_en: "60 seconds"
    body_zh: |-
      请围绕「{{视频选题}}」为我创作一条约 {{目标时长}} 的竖屏口播分镜脚本。

      核心原则（口播稿不是文字稿）：
      - **像跟朋友聊天**：每句 5–18 个字，一句话只说一个意思，保留自然停顿（用 `/` 标出）和重音（加粗），禁止「今天跟大家聊聊」「综上所述」等书面腔。
      - **前 3–5 秒必须给冲突**：直接抛反常识、数字对比或痛点，不做自我介绍。
      - **真人与证据比例 6:4**：真人负责 Hook 与判断，录屏/截图负责证据。

      按以下 6 段结构输出，并同时交付「分镜表（时间｜画面类型｜可直接念的口播｜屏幕大字｜剪辑提示）」+「拍摄前素材清单」：
      1. **0–5s Hook**：真人出镜，一句话抛出最大反差或问题。
      2. **5–15s 证据**：切录屏/截图/原始数据，证明不是空口判断。
      3. **15–25s 大白话解释**：切回真人，一句人话破除常见误解。
      4. **25–40s 核心机制/对比**：最多 2–3 组关键数据或过程，不塞满屏幕。
      5. **40–55s 与观众关系**：成本、风险或具体场景落点。
      6. **55s+ 个人判断**：给出明确观点与条件边界，留一个自然讨论问题收尾。
    body_en: |-
      Write a conversational {{duration}} vertical talking-head video script & shot list for: "{{video topic}}".

      Core principles (spoken script ≠ written essay):
      - **Talk like explaining to a friend**: 5–18 words per sentence, one idea per breath, mark natural pauses (`/`) and emphasis (**bold**). Zero stiff greetings ("Hey guys today we'll talk about...").
      - **3-second conflict hook**: Open with a counter-intuitive contrast, hard number, or urgent problem—no self-intro.
      - **60% Talking Head / 40% Visual Proof**: Use face-cam for hooks and judgment; cut to screen recordings/screenshots for evidence.

      Deliver a shot-by-shot table (`Time | Shot Type | Spoken Line | On-Screen Text | Edit Cue`) + a pre-shoot asset checklist across these 6 beats:
      1. **0–5s Hook** (Face-cam conflict)
      2. **5–15s Evidence** (Screen/proof cut)
      3. **15–25s Plain Explanation** (Kill the #1 misconception)
      4. **25–40s Core Mechanism** (Max 2–3 numbers or steps)
      5. **40–55s So What / Risk** (Why it matters to the viewer)
      6. **55s+ Your Call** (Clear judgment + one natural question)

  - id: chatcut-talking-head-edit
    category: media
    stage: "AI 剪辑"
    stage_en: "AI Video Edit"
    featured: false
    short: true
    title_zh: "ChatCut / AI 口播粗剪通用提示词模板"
    title_en: "ChatCut / AI Talking-Head Rough-Cut Prompt"
    summary_zh: "上传真人口播与录屏素材后直接粘贴的剪辑指令：精准卡点切 B-roll、放大关键数字、保留呼吸感、拒绝新闻主播腔。"
    summary_en: "Ready-to-paste editing instruction for AI video editors: locks the 3–5s hook, syncs B-roll cues, enlarges key metrics, and preserves natural pacing."
    tags_zh: ["ChatCut", "剪辑", "口播"]
    tags_en: ["ChatCut", "Video Editing", "Prompt"]
    vars:
      - key_zh: "时长"
        key_en: "duration"
        label_zh: "成片目标时长"
        label_en: "Target length"
        default_zh: "60 秒"
        default_en: "60 seconds"
      - key_zh: "Hook"
        key_en: "hook"
        label_zh: "前 3–5 秒必须保留的真人开头"
        label_en: "Exact 3–5s opening hook"
        default_zh: "同样的 AI 模型，为什么别人一次写对，你改了五轮还在报错？"
        default_en: "Same AI model—why does it ship cleanly on the first pass for some teams and break five times for others?"
      - key_zh: "素材切入点"
        key_en: "cut cues"
        label_zh: "说到什么词切什么录屏或数字页"
        label_en: "Spoken trigger → visual asset mapping"
        default_zh: "说到「五维扫描」时切到体检页面录屏；说到「95% 保留率」时放大显示数字对比卡片"
        default_en: "Cut to the dashboard recording on 'five-dimension scan'; show the metric card on '95% retention'"
    body_zh: |-
      把我上传的真人口播、截图、录屏和 B-roll 剪成一条约 {{时长}}、9:16 竖屏的口播视频：

      1. 前 3–5 秒保留真人 Hook：{{Hook}}
      2. 画面切入规则：{{素材切入点}}
      3. 核心判断段落尽量保留真人出镜，不要频繁切 B-roll 盖住人像。
      4. 删除说错、口误重复和无效长停顿，但**保留自然说话的呼吸节奏**。
      5. 中文字幕简洁克制，每屏不超过 1–2 行，关键数字单独放大高亮。
      6. 不要做成新闻主播风格，禁用夸张花字转场和搞笑音效。整体干净、可信、信息密度高，像一个人刚发现一件有意思的事正在跟朋友解释。
    body_en: |-
      Edit my uploaded talking-head footage, screenshots, screen recordings, and B-roll into a ~{{duration}} 9:16 vertical video:

      1. Keep this exact talking-head hook in the first 3–5 seconds: {{hook}}
      2. Visual cut cues: {{cut cues}}
      3. Keep the speaker on-camera during core judgment lines—do not over-cut to B-roll.
      4. Remove stumbles, retakes, and dead air while **preserving natural breathing pauses and cadence**.
      5. Keep captions clean (1–2 short lines per screen) and emphasize key numbers larger.
      6. Avoid news-anchor stiffness, flashy transitions, or comedic sound effects. Aim for clean, high-signal clarity—like explaining an exciting discovery to a smart friend.

