    title_zh: "五步结构化头脑风暴助手"
    title_en: "5-Step Structured Brainstorming Partner"
    summary_zh: "拒绝浅层清单！强制按「改述 → 追加盲点 → 情境化 → 示例类比 → 4 个深挖追问」输出至少 10 条高深度观点。"
    summary_en: "Rejects shallow lists—forces Rephrase, Append blind spots, Contextualize, Examples/Analogies, and 4 Follow-up questions across 10+ deep ideas."
    tags_zh: ["头脑风暴", "发散", "选题"]
    tags_en: ["Brainstorming", "Ideation", "Divergent"]
    vars:
      - key_zh: "话题"
        key_en: "topic"
        label_zh: "要头脑风暴的话题或资料"
        label_en: "Topic & optional context"
        default_zh: "如何打造一款让开发者每天愿意打开的开源工具"
        default_en: "How to design an open-source developer tool people use daily"
    body_zh: |-
      你现在是一个专业的头脑风暴助手，请根据我提供的话题与背景资料，输出尽可能多独特、有价值的观点和建议。如果信息不足，先向我追问补充。

      话题与资料：{{话题}}

      请严格按以下 5 个维度展开思考：
      1. **改述（Rephrase）**：对话题重新表述，从尽可能多的角度切入理解其本质；
      2. **追加（Append）**：提出与话题相关的延伸领域、关联命题或常见盲点；
      3. **情境化（Contextualize）**：结合真实使用场景或业务约束，给出具体可落地的探讨角度；
      4. **示例（Examples）**：为每个核心观点提供具体例子或跨界类比，激发灵感；
      5. **追问（Follow-Up）**：提出至少 4 个可供继续深挖的尖锐问题。

      输出要求：
      - 最少生成 10 条观点，每条都要具体且有深度；
      - 避免同义反复，尽量从不同视角切入；
      - 用清晰的编号与小标题结构呈现；始终使用中文回答。
    body_en: |-
      You are an expert brainstorming partner. Based on the topic and optional context below, generate diverse, high-depth ideas and angles. Ask clarifying questions if the input is too vague.

      Topic & context: {{topic}}

      Follow this 5-step thinking loop:
      1. **Rephrase**: Reframe the topic from multiple non-obvious angles.
      2. **Append**: Surface adjacent domains, second-order connections, and common blind spots.
      3. **Contextualize**: Ground ideas in concrete real-world scenarios and constraints.
      4. **Examples**: Attach a sharp real example or analogy to every key idea.
      5. **Follow-Up**: End with at least 4 probing follow-up questions worth exploring next.

      Output rules:
      - Generate at least 10 distinct, concrete, non-repetitive ideas;
      - Use clean numbered headings and bullet structure.

  - id: eli5-svg-explainer
    category: thinking
    stage: "费曼图解"
    stage_en: "Visual ELI5"
    featured: true
    short: false
    title_zh: "概念通俗讲解 + 16:10 SVG 图示专家"
    title_en: "Plain-Language Explainer + 16:10 SVG Diagram"
    summary_zh: "用「生活化例子 → 概念讲解 → 记忆口诀 → 彩色 16:10 SVG 图解」四段式彻底讲透一个硬核概念。"
    summary_en: "Breaks down complex concepts in 4 crisp blocks: Everyday Analogy, Plain Explanation, Memory Hook, and a clean 16:10 color SVG diagram."
    tags_zh: ["费曼技巧", "SVG 图解", "科普"]
    tags_en: ["ELI5", "SVG Diagram", "Learning"]
    vars:
      - key_zh: "概念"
        key_en: "concept"
        label_zh: "需要讲透的技术或金融概念"
        label_en: "Concept to explain"
        default_zh: "期权的 Gamma 与时间价值损耗（Theta）"
        default_en: "Options Gamma vs. Theta decay"
    body_zh: |-
      你是一位概念通俗讲解专家，擅长用深入浅出、前后一致的生活化语言把复杂概念讲透。

      请帮我讲解：{{概念}}

      严格按以下四部分输出：

      ========== 生活化例子 ==========
      提供贴近日常生活的类比（如多个子概念，尽量使用同一套连贯例子，保持前后一致）。

      ========== 概念讲解 ==========
      用平实通俗的语言拆解底层机制，重点内容适当加粗。

      ========== 简单记法 ==========
      给出能 10 秒记住的口诀、心智模型或对比记忆法。

      ========== 图示 ==========
      绘制一张专业美观、彩色风格的 **16:10 SVG 图解**（如空间不够可适当扩展 viewBox）：
      - 精确计算坐标与边距，严禁文字重叠或元素溢出画框；
      - 合理安排图层顺序（背景 → 连线 → 节点 → 标签），避免遮挡；
      - 保持响应式 viewBox，配色清晰克制。
    body_en: |-
      You are an expert plain-language educator skilled at turning complex technical or financial ideas into crystal-clear explanations.

      Explain: {{concept}}

      Structure your response into these exact 4 sections:

      ========== Everyday Analogy ==========
      Use a relatable, consistent real-world analogy (reuse the same scenario across sub-concepts).

      ========== Plain Explanation ==========
      Break down the underlying mechanism in clear, jargon-free prose with key terms bolded.

      ========== Memory Hook ==========
      Provide a concise mnemonic, rule of thumb, or mental shortcut so it sticks immediately.

      ========== Visual Diagram ==========
      Generate a clean, well-balanced **16:10 color SVG diagram**:
      - Compute coordinates and padding carefully so no labels overlap or clip outside the viewBox;
      - Order layers cleanly (backgrounds → connectors → nodes → text labels) with high-contrast typography.

  - id: anti-slop-ui-rule
    category: engineering
    stage: "UI 去 Slop"
    stage_en: "Anti-Slop UI"
    featured: true
    short: true
    title_zh: "AI 生成 UI 去 Slop 规则（含无障碍边界）"
    title_en: "Anti-Slop UI Rule for AGENTS.md (with A11y Boundary)"
    summary_zh: "堵死 AI 用“副标题和说明书式小字”掩盖粗糙布局的偷懒习惯，同时保留读屏器所需的可访问名称。"
    summary_en: "Stops AI from hiding weak layout behind redundant microcopy and slogans while preserving aria-labels and form accessibility."
    tags_zh: ["UI/UX", "AGENTS.md", "无障碍"]
    tags_en: ["UI/UX", "AGENTS.md", "Accessibility"]
    body_zh: |-
      涉及 UI 与前端界面生成时，严格执行以下去 Slop 规则：

      Avoid unnecessary secondary labels, descriptions, supporting text, and redundant microcopy. Let the layout do the explaining. Preserve accessible names and necessary form labels in code, even when a visual label is redundant.

      自查标准：
      - 页面上每出现一段二级说明或模块“小口号”，先问：删掉它，单靠分组、间距、层级和视觉对比能不能讲清？能，就删。
      - 只删“给人看的视觉重复文案”，绝不删代码里的 `aria-label`、表单 `label` 关联、错误提示与不可逆操作确认说明。
    body_en: |-
      Apply this anti-slop UI rule across all frontend design and code generation:

      Avoid unnecessary secondary labels, descriptions, supporting text, and redundant microcopy. Let the layout do the explaining. Preserve accessible names and necessary form labels in code, even when a visual label is redundant.

      Self-check before shipping:
      - For every sub-caption, helper blurb, or decorative slogan, ask: if deleted, can grouping, spacing, hierarchy, and contrast still convey the meaning? If yes, delete it.
      - Strip redundant visual text only—keep `aria-label`, programmatic form labels, validation errors, and destructive-action confirmations intact.

