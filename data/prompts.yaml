  - id: investment-devils-advocate
    category: workflow
    stage: "投资决策"
    stage_en: "Investing"
    featured: false
    short: false
    title_zh: "投资研究反方检查 Prompt"
    title_en: "Investment Devil's Advocate"
    summary_zh: "逼 AI 帮自己找反方证据、证伪条件和减仓边界，不做情绪化买卖判断。"
    summary_en: "Forces rigorous counter-arguments, falsifiable data, and position-reduction triggers instead of confirming your bias."
    tags_zh: ["投资", "反方检查", "风险管理"]
    tags_en: ["Investing", "Devil's Advocate", "Risk"]
    vars:
      - key_zh: "投资想法"
        key_en: "investment idea"
        label_zh: "投资想法"
        label_en: "Investment idea"
        default_zh: ""
        default_en: ""
      - key_zh: "资产或公司"
        key_en: "asset or company"
        label_zh: "标的"
        label_en: "Asset or company"
        default_zh: ""
        default_en: ""
      - key_zh: "持有周期"
        key_en: "holding period"
        label_zh: "持有周期"
        label_en: "Holding period"
        default_zh: "3-5 年"
        default_en: "3-5 years"
      - key_zh: "我的理由"
        key_en: "my reasoning"
        label_zh: "你的逻辑"
        label_en: "My reasoning"
        default_zh: ""
        default_en: ""
    body_zh: |-
      你是一名严谨的投资研究员。请不要只支持我的观点，而是从反方角度检查这个投资想法。

      投资想法：{{投资想法}}
      资产或公司：{{资产或公司}}
      持有周期：{{持有周期}}
      我的理由：{{我的理由}}

      请输出：最强支持理由、最强反对理由、我可能忽略的风险、可验证或证伪的数据、应该降低仓位的条件、可以继续持有的条件、一个不带情绪的结论。

      注意：不要给出直接买卖建议，重点是帮我提高判断质量。
    body_en: |-
      You are a rigorous investment researcher. Do not simply support my view. Check this investment idea from the strongest opposing perspective.

      Investment idea: {{investment idea}}
      Asset or company: {{asset or company}}
      Holding period: {{holding period}}
      My reasoning: {{my reasoning}}

      Please output: the strongest supporting case, the strongest opposing case, risks I may be ignoring, data that could validate or falsify the idea, conditions where position size should be reduced, conditions where holding may still be reasonable, and a final emotionally neutral conclusion.

      Do not give direct buy or sell advice. Focus on improving judgment quality.

