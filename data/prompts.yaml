  - id: eight-step-writing-sop
    category: writing
    stage: "八步写作"
    stage_en: "8-Step SOP"
    featured: true
    short: false
    title_zh: "毛毛星八步深度写作 SOP（先想清楚再讲清楚）"
    title_en: "8-Step Deep Writing SOP (Think First, Write Clear)"
    summary_zh: "完整实战写作体系：4 条不编造底线 → 锚定核心冲突 → 一手信源核查 → 三层递进主线 → 去主持人腔与 11 项终审。"
    summary_en: "Full non-fiction writing SOP: 4 truthfulness rules, single-sentence conflict anchor, primary-source audit, 3-layer progression, and 11-point final review."
    tags_zh: ["写作 SOP", "深度长文", "事实核查"]
    tags_en: ["Writing SOP", "Longform", "Fact-Check"]
    vars:
      - key_zh: "选题与一手材料"
        key_en: "topic and sources"
        label_zh: "写作选题、目标读者与参考材料"
        label_en: "Topic, target reader, and primary sources"
        default_zh: "为什么很多 AI 编程项目上线即变屎山？"
        default_en: "Why many AI-coded projects turn into unmaintainable spaghetti right after launch"
    body_zh: |-
      你负责按「毛毛星写作法」把以下选题写成值得读、经得起查的深度中文稿件。先想清楚（1–5 步），再讲清楚（6–7 步），最后查清楚（第 8 步终审）。

      选题与材料：{{选题与一手材料}}

      ## 零号底线（任何时候不许破）
      1. **不编造**：事实、数字、原话、第一人称经历一律不编；查不到写「未核到」，禁用「大概」「据说」。
      2. **证据成色如实标**：区分一手事实、单源转述、机构估算、情景预估，直接写给读者看。
      3. **算术自洽**：引用增速、占比、单价先核分母与勾稽关系。

      ## 执行八步
      - **第 1 步 锚定**：用一句话说清核心问题（必须同时满足：读者关心、存在冲突、能引发讨论）。
      - **第 2 步 一手输入**：先交「素材清单表」（信源｜一手/二手｜已读/未读｜核查状态），关键信源未读一手不开写。
      - **第 3–4 步 归类与主线**：跳出原材结构重建分类，提炼一句能串起全文的主线。
      - **第 5 步 三层重组**：摆事实 → 拆机制 → 落到读者身上，相邻段落必须有因果或转折。
      - **第 6 步 真实注入**：个人经历与判断只取我提供的真实表述，不替我编经历。
      - **第 7 步 表达硬规则**：
        - 禁主持人腔/报幕句（删掉「先看原文 / 划重点 / 接下来我们看」）；
        - 禁三连排比同构；「不是 X，而是 Y」全篇最多 1 次；
        - 小标题写信息，不写「第一层：背景介绍」式脚手架；
        - 先摆细节/数字再给判断；新术语首次出现用人话翻译；
        - 收尾停在具体事实与专属判断，禁用「让我们拭目以待」式万能升华。
      - **第 8 步 终审**：逐字核对核心问题、脚手架清零、算术自洽、信源口径与去 AI 味后再交付。
    body_en: |-
      Write a deeply researched, fact-checked article following this 8-step non-fiction SOP: Think First (Steps 1–5), Write Clear (Steps 6–7), and Audit Before Shipping (Step 8).

      Topic & sources: {{topic and sources}}

      ## Non-Negotiable Ground Rules
      1. **Zero fabrication**: Never invent facts, numbers, quotes, or first-person anecdotes. Mark unverified items explicitly.
      2. **Label evidence quality**: Distinguish primary facts, single-source claims, estimates, and projections openly for the reader.
      3. **Verify math**: Check denominators and unit consistency before citing any growth rate or ratio.

      ## 8-Step Workflow
      - **1. Anchor**: Define the core tension in one sentence (relevant, conflicting, debatable).
      - **2. Primary Sources**: Build a source table (Source | Primary/Secondary | Read/Unread | Verification status) before drafting.
      - **3–4. Structure & Spine**: Regroup around the core tension and extract one unifying thesis sentence.
      - **5. 3-Layer Progression**: Facts → Mechanism → Impact on the reader, with explicit causal links between paragraphs.
      - **6. Authentic Voice**: Only include real personal experiences I provide—never invent anecdotes.
      - **7. Craft Rules**: Strip host-style announcements ("let's look at next", "here are the key points"), avoid repetitive parallel triplets, keep headings informative (no scaffolding labels), translate jargon on first mention, and end on a concrete takeaway rather than generic clichés.
      - **8. Line-by-Line Audit**: Read every sentence to verify sources, math, transitions, and zero AI slop before delivery.

  - id: no-host-announcements
    category: writing
    stage: "去 AI 味"
    stage_en: "No Host Tone"
    featured: true
    short: true
    title_zh: "去 AI 味补丁：禁主持人腔（报幕句）"
    title_en: "Anti-AI-Slop Patch: Ban Host Announcements"
    summary_zh: "专门清理文章、卡片和脚本里最显 AI 味的“报幕句”（先看原文、划重点、接下来我们看），用事实本身过渡。"
    summary_en: "Strips out zero-information announcer transitions ('let's look at', 'here's the key takeaway') and replaces them with concrete facts."
    tags_zh: ["去 AI 味", "改稿", "报幕句"]
    tags_en: ["Anti-Slop", "Editing", "Transitions"]
    vars:
      - key_zh: "待审草稿"
        key_en: "draft"
        label_zh: "需要清理报幕句的文稿"
        label_en: "Draft to de-slop"
        default_zh: "请粘贴你的文章或小红书图文草稿"
        default_en: "Paste your article or post draft here"
    body_zh: |-
      逐句审查下面的文稿，清理所有「主持人腔 / 报幕句」：

      规则：标题、小标题、卡片标题和过渡句只写信息本身，严禁用替读者「预告」内容的报幕句（这类句子不增加任何信息，是最典型的 AI 味）。

      重点排查并删改这些病句模式：
      - 「数据和政策都摆出来」「先看原文」「接下来我们看」「话不多说」
      - 「划重点」「敲黑板」「重点来了」「换个算法看看」「排名一摆就冷静了」

      改法示例：
      - ❌「先看原文：政策和数据，都摆出来」→ ✅「国办 29 号文件原文」
      - ❌「排名一摆就冷静了」→ ✅「需供比排名（智联三季度）：」
      - ❌「换个算法，不看增速，看抢人程度」→ ✅「缺不缺人，看需供比。」

      输出：先列出修改对照表（原句 → 改后），再给出清理干净的全文。

      待审草稿：
      {{待审草稿}}
    body_en: |-
      Audit the draft below line by line and eliminate all "host-style announcer transitions":

      Rule: Headings, subheadings, card titles, and transitions must state the information itself—never announce to the reader what you are about to show next.

      Strip patterns such as:
      - "Let's look at the data", "Next, let's dive into", "Here is the key point", "Without further ado", "Let's break this down"

      Example fixes:
      - ❌ "First, let's look at the official numbers" → ✅ "Q3 Hiring Supply-Demand Ratio (Zhilian):"
      - ❌ "Now let's switch perspectives" → ✅ "What actually drives retention is onboarding speed:"

      Output a before/after diff table first, then the clean revised draft.

      Draft:
      {{draft}}

  - id: writing-value-domino-check
    category: writing
    stage: "深度终审"
    stage_en: "Value Gate"
    featured: false
    short: false
    title_zh: "判断价值门槛 + 多米诺递进终审"
    title_en: "Value Gate & Domino Progression Audit"
    summary_zh: "消灭脱离主题也能成立的“正确的废话”，检查相邻段落是否如多米诺骨牌般因果推动，结尾是否真正回收开头。"
    summary_en: "Kills generic truisms ('stay patient', 'think independently') and enforces causal domino flow plus a concrete, non-cliché ending."
    tags_zh: ["终审", "逻辑链", "信息密度"]
    tags_en: ["Editing", "Logic Flow", "Signal"]
    vars:
      - key_zh: "文章正文"
        key_en: "article body"
        label_zh: "待终审的文章正文"
        label_en: "Article body to audit"
        default_zh: "请粘贴需要做深度逻辑与废话审查的正文"
        default_en: "Paste article body for value & flow audit"
    body_zh: |-
      请用「判断价值门槛 + 多米诺骨牌递进」标准审校以下文章：

      1. **判断价值门槛（删“正确的废话”）**：文中每一个判断，必须至少提供以下一种增量价值：解释机制或因果链 / 区分易混淆情况 / 改变决策条件 / 给出可执行检查或关键验证变量。如果一句话脱离本文主题放到任何商业或成长文章里都成立（如“保持耐心、独立思考、坚持长期主义”），一律标出并删除或改写为「对象 + 比较关系 + 触发条件 + 可执行动作」。
      2. **多米诺骨牌式推进**：检查删掉所有小标题后，正文是否仍能顺畅连读？相邻段落是否构成因果、转折或追问，而不是把观点并列成资料卡？
      3. **具体细节托底**：检查每个重要论断的同一屏内是否有可见细节（谁做了什么、钱从哪流向哪、分母与时间范围）。
      4. **结尾验收**：是否回收了开头的问题/画面？是否压缩出一句只属于本文、可被记住的判断 + 一个具体可回答的思考题或行动顺序？

      待审正文：
      {{文章正文}}
    body_en: |-
      Audit the article below against the **Value Gate & Domino Progression** standard:

      1. **Value Gate (Kill generic truisms)**: Every claim must add at least one of: causal mechanism, sharp distinction, decision threshold change, or actionable verification check. Flag and delete/rewrite any sentence that would fit any random business/self-help essay ("stay patient", "think long-term", "keep learning"). Rewrite judgments as: `Subject + Comparison + Trigger Condition + Concrete Action`.
      2. **Domino Flow**: If you remove all subheadings, do adjacent paragraphs still push each other forward via cause, contrast, or follow-up questions rather than reading like disconnected bullet cards?
      3. **Detail Grounding**: Ensure every major claim has visible evidence nearby (who acted, money/data flow, denominator, and timeframe).
      4. **Closing Check**: Does the ending resolve the opening tension with a specific, article-unique takeaway and a concrete next check?

      Article:
      {{article body}}

  - id: blackstone-article-style
    category: writing
    stage: "体式模板"
    stage_en: "Style Spec"
    featured: false
    short: true
    title_zh: "黑石体：高信息密度硬核长文体式"
    title_en: "Blackstone Style: Ultra-Dense Fact-First Format"
    summary_zh: "极简高密度的研究/行业解析排版口令：开篇要点 + 编号硬数据 + 原话独立成行，议论只留头尾两处。"
    summary_en: "Ultra-dense research format: key takeaways upfront, numbered hard data and verbatim quotes in the body, commentary restricted to conclusions."
    tags_zh: ["黑石体", "公众号", "高信息密度"]
    tags_en: ["Format", "Research", "High Density"]
    vars:
      - key_zh: "素材或主题"
        key_en: "material"
        label_zh: "要写成黑石体的素材或主题"
        label_en: "Topic or raw research material"
        default_zh: "请粘贴研报、访谈实录或行业新闻素材"
        default_en: "Paste research notes, transcript, or news material"
    body_zh: |-
      请按「黑石体」写下面这篇内容：
      - 信息密度拉满，标题必须有真实冲突感；
      - 开篇用「📍 核心要点」3 句话直击全篇最硬结论，接 `━━━` 分隔线；
      - 正文用 ① ② ③ 编号 + 硬数据 + 关键人物/文件原话独立成行推进，默认不加作者个人主观议论；
      - 议论与判断只留在「⭐ 核心结论」和「📝 写在最后」两处，末尾附「📌 来源说明」与「⚠️ 合规提示」。

      素材或主题：
      {{素材或主题}}
    body_en: |-
      Write the piece below in the high-density **Blackstone Research Format**:
      - Maximize signal density with a tension-driven headline;
      - Open with 3 crisp upfront takeaways (`📍 Key Takeaways`), followed by a divider;
      - Advance the body strictly via numbered blocks (`① ② ③`), hard numbers, and standalone verbatim quotes—keep subjective commentary out of the body;
      - Reserve analysis strictly for `⭐ Core Conclusions` and `📝 Final Note`, ending with source citations.

      Material:
      {{material}}

  - id: x-viral-hook-template
    category: writing
    stage: "爆款开头"
    stage_en: "Viral Hook"
    featured: true
    short: true
    title_zh: "X / 社交爆款四行开头公式（中英模板）"
    title_en: "4-Line Viral Hook Formula (X / Thread / Short Video)"
    summary_zh: "「站队表态 → 转折出痛点 → 好消息+我亲自发现+奇数清单 → 量化倍数承诺」四行高互动开篇模板。"
    summary_en: "High-engagement 4-line opener: Strong stance → Shared pain point → 'I figured out N ways' → Concrete multiplier promise."
    tags_zh: ["X/Twitter", "爆款开头", "Hook"]
    tags_en: ["X/Twitter", "Hook", "Copywriting"]
    vars:
      - key_zh: "产品或工具"
        key_en: "product"
        label_zh: "主角产品或工具名"
        label_en: "Product or tool name"
        default_zh: "Claude Code"
        default_en: "Claude Code"
      - key_zh: "痛点资源"
        key_en: "pain resource"
        label_zh: "大家觉得不够用的稀缺资源"
        label_en: "Scarce resource people want more of"
        default_zh: "上下文和额度"
        default_en: "usage quota"
      - key_zh: "招数数量"
        key_en: "count"
        label_zh: "奇数清单数量（如 7）"
        label_en: "Odd number of tricks (e.g. 7)"
        default_zh: "7"
        default_en: "7"
      - key_zh: "量化结果"
        key_en: "multiplier"
        label_zh: "真实可兑现的倍数或结果"
        label_en: "Verified multiplier or outcome"
        default_zh: "3 倍"
        default_en: "3x"
    body_zh: |-
      请用这套 4 行高互动开头公式，为「{{产品或工具}}」生成 3 组中文版（适合小红书/视频号）和 3 组英文版（适合 X Thread）开头：

      【结构模板】
      第 1 行（站队）：{{产品或工具}} 是现在最强的 [品类]，没有之一。
      第 2 行（痛点）：问题是：大家总觉得 {{痛点资源}} 不够用。
      第 3 行（一手发现）：好消息：我摸出了 {{招数数量}} 个办法，让同样的成本多干好几倍活。
      第 4 行（量化交付）：这条把 {{招数数量}} 招全讲完，看完你能把产出翻 {{量化结果}}：

      注意约束：
      - 一行一句，手机首屏一眼读完；
      - 第 1 行必须是真心话；第 4 行倍数只用实测过的数据，没实测写「大幅提升」；
      - 同时输出一个 ≤20 字的小红书短标题。
    body_en: |-
      Generate 3 English X/Thread openers and 3 Chinese openers for "{{product}}" using this 4-line viral hook formula:

      Line 1 (Bold stance): {{product}} is easily the best [category] on planet Earth right now
      Line 2 (Shared pain): The issue is, people want MORE {{pain resource}}
      Line 3 (First-hand discovery): Good news: I figured out {{count}} ways to get WAY more out of {{product}}
      Line 4 (Concrete promise): In this thread/video I cover all {{count}} tricks so you can get {{multiplier}} more out of {{product}}:

      Constraints:
      - One sentence per line, scannable on mobile;
      - Only capitalize 1–2 desire words (MORE, WAY);
      - Back up any multiplier with real experience—never fake metrics.

  - id: cover-art-7-styles
    category: media
    stage: "封面生图"
    stage_en: "Cover Styles"
    featured: true
    short: false
    title_zh: "博客与文章封面 7 种生图关键词库"
    title_en: "7 Editorial Cover Art Style Prompts + Topic Matcher"
    summary_zh: "按文章题材精准匹配 7 种高级感视觉风格（黑白地下 / 复古版画 / 美联社纪实 / 水墨 / 波普 / 赛博朋克 / 浮世绘），附直接可用的英文生图关键词。"
    summary_en: "Curated prompt library for 7 distinct cover aesthetics (Underground Zine, Woodcut, AP Press, Shuimo Ink, Pop Art, Cyberpunk, Ukiyo-e) matched by topic."
    tags_zh: ["生图", "封面设计", "视觉风格"]
    tags_en: ["Image Gen", "Cover Art", "Styles"]
    vars:
      - key_zh: "文章主题"
        key_en: "article topic"
        label_zh: "要画封面的文章标题或画面主体"
        label_en: "Article topic or visual subject"
        default_zh: "AI Agent 在真实代码库里持续巡检与修复 Bug"
        default_en: "An AI agent patrolling a live codebase and fixing bugs overnight"
    body_zh: |-
      请为文章「{{文章主题}}」匹配最贴合的封面风格，并生成可直接粘贴到生图模型（Nano Banana / Midjourney / GPT Image）的完整英文提示词（Prompt）：

      ## 7 种可选风格与对应英文关键词
      1. **黑白地下风**（批判 / 祛魅 / 行业真相）：`black and white underground zine, photocopied punk fanzine, high-contrast grain, raw cut-and-paste collage`
      2. **复古版画风**（历史复盘 / 经典理论 / 深度长文）：`vintage woodcut engraving, linocut print, cross-hatching, antique book illustration`
      3. **美联社纪实风**（新闻 / 访谈 / 现场报道）：`Associated Press photojournalism, documentary news photography, realistic press photo, on-the-scene`
      4. **中国水墨画风**（文化 / 哲学 / 随笔 / 东方视角）：`Chinese ink wash painting, shuimo, minimalist brush strokes, lots of negative space`
      5. **波普艺术风**（消费 / 流行文化 / 轻松选题）：`pop art, Roy Lichtenstein halftone dots, Andy Warhol screen print, bold primary colors, comic style`
      6. **赛博朋克风**（AI / 未来科技 / 机器人）：`cyberpunk, neon lights, rainy futuristic city, blade runner mood, cyan and magenta`
      7. **浮世绘风**（趋势浪潮 / 时代变迁比喻）：`Japanese ukiyo-e woodblock print, Hokusai and Hiroshige style, flat colors, bold outlines`

      要求：不要只写风格名，必须把选中风格的英文关键词与具体主体画面、构图、光线和留白（避免文字乱码，不生成画面文字）融合成 2 条可直接使用的高质量生图 Prompt。
    body_en: |-
      Match the best cover aesthetic below to the article "{{article topic}}" and write 2 ready-to-use image generation prompts (combining the exact style keywords with a concrete visual metaphor, lighting, and clean negative space with NO text in image):

      1. **Underground Zine** (Critique / Industry Truth): `black and white underground zine, photocopied punk fanzine, high-contrast grain, raw cut-and-paste collage`
      2. **Vintage Woodcut** (History / Deep Essay / Theory): `vintage woodcut engraving, linocut print, cross-hatching, antique book illustration`
      3. **AP Photojournalism** (News / Interviews / Field Reports): `Associated Press photojournalism, documentary news photography, realistic press photo, on-the-scene`
      4. **Chinese Shuimo Ink** (Culture / Philosophy / Personal Essays): `Chinese ink wash painting, shuimo, minimalist brush strokes, lots of negative space`
      5. **Pop Art** (Consumer Tech / Pop Culture): `pop art, Roy Lichtenstein halftone dots, Andy Warhol screen print, bold primary colors, comic style`
      6. **Cyberpunk** (AI / Robotics / Frontier Tech): `cyberpunk, neon lights, rainy futuristic city, blade runner mood, cyan and magenta`
      7. **Ukiyo-e Woodblock** (Macro Waves / Era Shifts): `Japanese ukiyo-e woodblock print, Hokusai and Hiroshige style, flat colors, bold outlines`

