      论文内容：
      {{论文链接或PDF}}
    body_en: |-
      You are a research paper reading assistant. Digest the paper below into this structured breakdown:

      Paper Link / Title:

      ## 1. High-Level Overview
      ## 2. Technical Breakdown
      ### 2.1 Problem Statement
      ### 2.2 Methodology & Architecture
      ### 2.3 Key Innovations
      ### 2.4 Main Results & Limitations
      ## 3. Practical & Engineering Implications
      ## 4. 5 Deep-Dive Questions & Answers (Q1–Q5)

      Paper:
      {{paper}}

  - id: newsletter-analysis-report
    category: workflow
    stage: "Newsletter"
    stage_en: "Newsletter"
    featured: false
    short: true
    title_zh: "Newsletter 深度分析报告（Markdown）"
    title_en: "Newsletter Deep Analysis Report (Markdown)"
    summary_zh: "把长 Newsletter 自动压缩为核心主题摘要 + 3 个深度思考问答，输出干净的 Markdown 研报。"
    summary_en: "Summarizes any newsletter into key themes plus 3 thought-provoking Q&As, formatted as a clean Markdown report."
    tags_zh: ["Newsletter", "信息总结", "Markdown"]
    tags_en: ["Newsletter", "Analysis", "Markdown"]
    vars:
      - key_zh: "Newsletter 原文"
        key_en: "newsletter"
        label_zh: "Newsletter 正文内容"
        label_en: "Newsletter content"
        default_zh: "请粘贴这一期 Newsletter 的原文"
        default_en: "Paste the newsletter issue here"
    body_zh: |-
      你是一位资深的行业评论员。请对下面这期 Newsletter 撰写一份结构化的 Markdown 分析报告：

      1. **核心摘要（Summarize）**：用清晰精炼的语言提炼本期核心观点与主线主题。
      2. **3 个深度思考问答（Interesting Questions）**：针对内容提出 3 个有洞察力、值得追问的问题。每题格式如下：
         - `Q:` 描述核心问题
         - `A:` 结合上下文给出详尽拆解，并将最终核心答案用 `<>` 括起来。
      3. **综合分析报告**：将摘要与问答整合为一篇结构完整的 Markdown 中文报告。

      Newsletter 原文：
      {{Newsletter 原文}}
    body_en: |-
      You are a commentator. Your task is to write a structured Markdown analysis report on the newsletter below:

      # Newsletter:
      {{newsletter}}

      # Instructions:
      ## Summarize:
      In clear and concise language, summarize the key points and themes presented in the newsletter.

      ## Interesting Questions:
      Generate three distinct and thought-provoking questions about the newsletter. For each question:
      - After "Q: ", describe the problem
      - After "A: ", provide a detailed explanation of the problem addressed in the question
      - Enclose the ultimate answer in <>.

      ## Write an analysis report
      Combine the summary and the answers into one cohesive Markdown report.

  - id: purpose-driven-summary
    category: workflow
    stage: "定向总结"
    stage_en: "Action Summary"
    featured: true
    short: true
    title_zh: "指定读者与用途的信息总结进阶版"
    title_en: "Audience & Action-Driven Summary"
    summary_zh: "拒绝空泛通用摘要！先锁定「读者是谁 + 读完要做什么事」，严格按背景→结论→证据→风险→下一步输出。"
    summary_en: "Bans generic summaries—tailors output to a specific reader and decision, separating facts, synthesis, and next actions."
    tags_zh: ["信息总结", "汇报", "决策"]
    tags_en: ["Summary", "Briefing", "Decision"]
    vars:
      - key_zh: "读者"
        key_en: "reader"
        label_zh: "这份总结给谁看？"
        label_en: "Who is the target reader?"
        default_zh: "前端架构负责人"
        default_en: "Engineering Lead"
      - key_zh: "读完要做的事"
        key_en: "action"
        label_zh: "读者看完后要做什么决策或动作？"
        label_en: "What decision or action follows?"
        default_zh: "决定下周是否立项接入该方案"
        default_en: "Decide whether to greenlight adoption next week"
      - key_zh: "长度上限"
        key_en: "max length"
        label_zh: "字数限制"
        label_en: "Word/length cap"
        default_zh: "500 字以内"
        default_en: "Under 400 words"
      - key_zh: "材料"
        key_en: "material"
        label_zh: "待总结的原始材料"
        label_en: "Source material"
        default_zh: "请粘贴会议记录、长报告或调研文档"
        default_en: "Paste meeting notes, report, or research doc"
    body_zh: |-
      请总结下面这份材料。总结前先严格锚定目标读者与后续行动，不要给通用摘要：
      - 读者是：{{读者}}
      - 读完要做的事：{{读完要做的事}}
      - 长度上限：{{长度上限}}

      要求：
      1. 严格按「背景 → 结论 → 证据 → 风险 → 下一步」组织。
      2. **事实、资料归纳、推导建议**三类内容分开标注，绝不混写。
      3. 总结不是越短越好，唯一标准是让目标读者读完能立刻继续行动。

      材料：
      {{材料}}
    body_en: |-
      Summarize the material below strictly for the specified reader and decision—do not output a generic summary:
      - Target reader: {{reader}}
      - Action / decision after reading: {{action}}
      - Length limit: {{max length}}

      Rules:
      1. Organize as: `Context → Conclusions → Evidence → Risks → Next Steps`.
      2. Label **Facts**, **Synthesis**, and **Recommendations** separately—never blur them together.
      3. Optimize for decision readiness, not arbitrary brevity.

      Material:
      {{material}}

  - id: schema-first-extractor
    category: workflow
    stage: "先定字段"
    stage_en: "Schema Extract"
    featured: false
    short: true
    title_zh: "先定字段的信息提取进阶版"
    title_en: "Schema-First Fact Extractor (Zero Guessing)"
    summary_zh: "提前规定抽取字段，禁止 AI 自由发挥“重点”，找不到写未提及，冲突点显式标出。"
    summary_en: "Forces extraction into pre-defined fields: marks missing items 'Not mentioned', separates facts from inference, and flags contradictions."
    tags_zh: ["信息提取", "字段化", "防幻觉"]
    tags_en: ["Extraction", "No Hallucination", "Facts"]
    vars:
      - key_zh: "字段列表"
        key_en: "fields"
        label_zh: "需要提取的字段"
        label_en: "Fields to extract"
        default_zh: "人物、时间、事件、核心数字、结论、证据、待确认项"
        default_en: "People, Date, Event, Key Metrics, Conclusions, Evidence, Open Questions"
      - key_zh: "文本"
        key_en: "text"
        label_zh: "待提取的原始长文本"
        label_en: "Source text"
        default_zh: "请粘贴访谈、财报或新闻原文"
        default_en: "Paste transcript, filing, or article text"
    body_zh: |-
      从下面这份长文本里提取信息。严格按我定义的字段提取，不要自由发挥「重点」：
      字段：{{字段列表}}

      规则：
      - 找不到的字段明确写「未提及」，不许猜测或脑补；
      - 事实和推测必须分开列；
      - 原文中互相冲突的内容同时保留，并显式标明冲突点。

      文本：
      {{文本}}
    body_en: |-
      Extract information from the text below strictly into the defined fields—do not improvise custom highlights:
      Fields: {{fields}}

      Rules:
      - Write `Not mentioned` for any missing field—never guess;
      - Separate verified facts from inferences;
      - Keep contradictory claims side by side and explicitly flag the conflict.

      Text:
      {{text}}

  - id: unsorted-allowed-classifier
    category: workflow
    stage: "严谨分类"
    stage_en: "Safe Classify"
    featured: false
    short: true
    title_zh: "允许「待归类」与多标签的信息分类器"
    title_en: "Taxonomy Classifier (with Unsorted & Multi-Label Exits)"
    summary_zh: "不合适的内容绝不硬塞！强制保留「待归类」和「多标签」出口，并输出理由与置信度，反向诊断分类体系缺陷。"
    summary_en: "Never force-fits edge cases—allows 'Unsorted' and 'Multi-label' exits with confidence scores to diagnose taxonomy flaws."
    tags_zh: ["信息分类", "数据清洗", "置信度"]
    tags_en: ["Classification", "Taxonomy", "Data"]
    vars:
      - key_zh: "类别定义"
        key_en: "categories"
        label_zh: "类别定义（含正例与反例）"
        label_en: "Category definitions (with examples)"
        default_zh: "A类：产品Bug反馈；B类：新功能建议；C类：商业合作咨询"
        default_en: "A: Bug Report; B: Feature Request; C: Partnership Inquiry"
      - key_zh: "待分类内容"
        key_en: "items"
        label_zh: "待分类的条目列表"
        label_en: "Items to classify"
        default_zh: "请粘贴需要分类的条目或用户反馈"
        default_en: "Paste items or user feedback here"
    body_zh: |-
      把下面内容按我给的类别定义分类，先读完所有正例与边界再判断：
      {{类别定义}}

      规则：
      - 允许两个安全出口：「待归类」和「多标签」，不合适的内容绝不硬塞进固定类别；
      - 每条必须给出分类理由和置信度（高 / 中 / 低）；
      - 如果一批内容有大量落进「待归类」，说明当前分类规则本身有缺陷，请在最后单独指出规则哪里需要修改。

      待分类内容：
      {{待分类内容}}
    body_en: |-
      Classify the items below according to these category definitions:
      {{categories}}

      Rules:
      - Allow two explicit escape hatches: `Unsorted` and `Multi-label`—never force-fit ambiguous items;
      - Output a short rationale and confidence level (High / Medium / Low) for every item;
      - If a large share falls into `Unsorted`, diagnose the flaws in the taxonomy itself at the end.

      Items:
      {{items}}

  - id: product-validation-gate
    category: workflow
    stage: "选品审查"
    stage_en: "Idea Vetting"
    featured: true
    short: true
    title_zh: "独立开发选品验证审查（一票否决门槛）"
    title_en: "Indie Product Demand Validation Gate (Veto Checklist)"
    summary_zh: "只做已被验证的需求！用「真实付费续费证据 + 主动搜索量 + 明确冷启动渠道 + 能力圈」4 道一票否决门拷问每一个新点子。"
    summary_en: "Build only proven demand: vets product ideas against 4 strict veto gates—existing paying users, search intent, distribution channel, and builder fit."
    tags_zh: ["独立开发", "选品", "PMF"]
    tags_en: ["Indie Hacking", "Validation", "PMF"]
    vars:
      - key_zh: "候选产品或需求"
        key_en: "product idea"
        label_zh: "要审查的候选产品或需求方向"
        label_en: "Candidate product or demand to vet"
        default_zh: "面向跨境电商卖家的 AI 评论痛点挖掘工具"
        default_en: "An AI review-mining tool for cross-border e-commerce sellers"
    body_zh: |-
      你是一个严苛的独立产品选品审查员。按下面 4 道一票否决门槛审查我给的候选产品/需求，任何一条不通过就判出局，绝不和稀泥：

      候选产品/需求：{{候选产品或需求}}

      ## 入选门槛（一票否决）
      1. **已有真实付费证据**：市面上是否已有产品在为这个需求收费、且有人持续续费？（只有“痛点很真实、访谈说愿意付”一律不算数）
      2. **需求可被搜索验证**：目标用户遇到问题时是否会主动搜索它？（有稳定搜索意图即“已发生的投票”）
      3. **有明确的第一批分发渠道**：前 100 个用户从哪来？路径要能说清到具体社区/搜索词/平台，说不清就淘汰。
      4. **我能做且能长期维护**：技术栈、数据源稳定性和持续获客都在个人能力圈内。

      请输出：竞品与收费证据（具体产品名 + 定价/续费模式）、搜索意图分析、冷启动分发路径、4 项逐条判定（过/不过），以及最终的「建议推进 / 立刻淘汰」结论。
    body_en: |-
      You are a ruthless indie product validation reviewer. Evaluate the candidate product/demand below against 4 strict veto gates—if any gate fails, reject it without sugarcoating:

      Candidate idea: {{product idea}}

      ## 4 Veto Gates
      1. **Existing Paid Proof**: Are customers already paying—and renewing—for an existing product solving this exact problem? ("People said they'd pay in interviews" does NOT count.)
      2. **Searchable Demand**: Do target users actively search for this solution? (Search volume = verified intent.)
      3. **Clear First-100 Distribution**: Can you name the exact communities, keywords, or channels for the first 100 users? If vague, reject.
      4. **Builder & Maintenance Fit**: Can a solo builder ship and sustainably maintain the tech and data pipeline?

      Output: Paid competitor proof (names + pricing), search intent check, concrete distribution path, pass/fail per gate, and a clear **Greenlight / Kill** verdict.
