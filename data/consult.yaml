faqs:
  - q: "可以用 Stripe 信用卡 / 微信 / 支付宝付款吗？"
    a: "支持。接入 Stripe Checkout 后可直接使用信用卡或支持的本地支付方式；如需先对齐需求再付款，也可直接加微信（maoxunxing）或发邮件沟通后通过微信/对公/Stripe 结算。"
  - q: "如何确保我的需求和边界清晰，不踩坑？"
    a: "所有服务均遵循「先对齐范围与交付清单，再确认下单」。如果评估后你的需求不在我能力圈或当前方案不划算，我会直接劝退或给出免费替代路径，不硬接单。"
  - q: "AI 工具 1v1 陪跑需要提前准备什么？"
    a: "提前把你想解决的 1–3 个具体问题、正在使用的工具（如 Claude Code / Cursor / Codex）和代码库场景发我，90 分钟全程直奔实战，不讲空洞概念。"
