faqs:
  - q: "第一次合作不确定是否合适，推荐先选哪个？"
    a: "推荐先选 ¥299 的「30 分钟 1v1 破冰快诊」，直接拿你的真实代码或问题连线验证；如果后续决定升级为 90 分钟陪跑或独立站开发，¥299 可全额抵扣。"
  - q: "可以用 Stripe 信用卡 / 微信 / 支付宝付款吗？"
    a: "支持。接入 Stripe Checkout 后可直接使用信用卡或支持的本地支付方式；如需先对齐需求再付款，也可直接加微信（maoxunxing）或发邮件沟通后结算。"
  - q: "如何确保我的需求和边界清晰，不踩坑？"
    a: "所有服务均遵循「先对齐范围与交付清单，再确认下单」。如果评估后你的需求不在我能力圈或当前方案不划算，我会直接劝退或给出免费替代路径，不硬接单。"
