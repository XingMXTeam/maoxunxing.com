<div class="subscribe-container">
  <div class="subscribe-container-inner">
    <h3>{{ T "subscribe1" }}</h3>
    <p>{{ T "subscribe2" }}</p>

    <form
      action="https://gmail.us5.list-manage.com/subscribe/post?u=c3b0164459768548b7bef380c&amp;id=1103acd526&amp;f_id=000042edf0"
      method="post"
      id="mc-embedded-subscribe-form"
      name="mc-embedded-subscribe-form"
      target="_blank"
    >
      <label class="sr-only" for="mce-EMAIL">{{ T "emailAddress" }}</label>
      <input
        type="email"
        name="EMAIL"
        id="mce-EMAIL"
        placeholder="{{ T "subscribePlaceholder" }}"
        required
        autocomplete="email"
      />

      <div
        class="honeypot"
        style="position: absolute; left: -5000px;"
        aria-hidden="true"
      >
        <input
          class="ninja"
          type="text"
          name="b_c3b0164459768548b7bef380c_1103acd526"
          tabindex="-1"
          value=""
          autocomplete="off"
        />
      </div>

      <div class="clear">
        <input
          type="submit"
          value="{{ T "subscribe" }}"
          name="subscribe"
          class="subscribe-btn"
        />
      </div>
    </form>
  </div>
</div>
