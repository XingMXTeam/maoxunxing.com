{{- $edition := .edition | default "zh" -}}
{{- $book := site.Data.optionsDabaihua -}}
{{- $href := $book.amazonZh -}}
{{- $label := .label | default "在亚马逊购买本书" -}}
{{- if eq $edition "en" -}}
  {{- $href = $book.amazonEn -}}
{{- end -}}
<a
  class="options-buy{{ if eq $edition "en" }} is-secondary{{ end }}"
  href="{{ $href }}"
  target="_blank"
  rel="noopener noreferrer"
>
  <span class="options-buy-label">{{ $label }}</span>
  <span class="options-buy-url">{{ $href }}</span>
</a>
