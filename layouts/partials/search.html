<script src="/third-party/algolia/autocomplete-js.js"></script>
<!-- for the search only version -->
<script src="/third-party/algolia/algoliasearch-lite.umd.js"></script>
<script>
  const { autocomplete, getAlgoliaResults } = window['@algolia/autocomplete-js'];
  const algoliasearch = window.algoliasearch;
  const searchClient = algoliasearch(
    'D7NQ3RODEC',
    'cac594df3c563fecd3ad54a0e399c173'
  );
  // NOTE (2026-10-15): removed dead Mustache-style hitTemplate/missTemplate string templates.
  // They were never used (autocomplete renders via createElement below), and the literal
  // triple-brace permalink hrefs were flagged as broken links by site crawlers.

  // Algolia URIs keep the Hugo section prefix (and sometimes a .zh-cn/.en
  // filename suffix), but the site's permalinks drop both — without this
  // normalization most result links 404 (audited 2026-10-24: 117 of 223
  // indexed records were broken). Sections NOT in the permalink config
  // (e.g. ai-coding-workflow) keep their prefix and are left untouched.
  const SECTION_PREFIXES = ['notes', 'posts', 'projects', 'book-reports', 'prompts', 'long-term-investing', 'about', 'uses', 'bookmarks', 'media', 'streams', 'demos', 'gallery', 'raw', 'pages'];
  function buildResultUrl(item) {
    const lang = location.pathname.split('/')[1];
    const parts = item.uri.split('/').filter(Boolean);
    if (parts.length > 1 && SECTION_PREFIXES.includes(parts[0])) parts.shift();
    if (parts.length) {
      parts[parts.length - 1] = parts[parts.length - 1].replace(/\.(zh-cn|en)$/, '');
    }
    return `${location.protocol}//${location.host}/${lang}/${parts.join('/').toLowerCase()}`;
  }

  // Keyboard-hint footer inside the detached search modal (DocSearch-style).
  function ensureSearchFooter() {
    const container = document.querySelector('.aa-DetachedContainer');
    if (!container || container.querySelector('.aa-DetachedFooter')) return;
    const footer = document.createElement('div');
    footer.className = 'aa-DetachedFooter';
    footer.innerHTML = {{ if hasPrefix .Site.Language.Lang "zh" }}'<span><kbd>↵</kbd> 选择</span><span><kbd>↑</kbd><kbd>↓</kbd> 导航</span><span><kbd>Esc</kbd> 关闭</span>'{{ else }}'<span><kbd>↵</kbd> to select</span><span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span><span><kbd>Esc</kbd> to close</span>'{{ end }};
    container.appendChild(footer);
  }

  autocomplete({
    container: '#docsearch',
    detachedMediaQuery: '',
    placeholder: {{ if hasPrefix .Site.Language.Lang "zh" }}'搜索'{{ else }}'Search'{{ end }},
    translations: {
      detachedCancelButtonText: {{ if hasPrefix .Site.Language.Lang "zh" }}'取消'{{ else }}'Cancel'{{ end }},
      clearButtonTitle: {{ if hasPrefix .Site.Language.Lang "zh" }}'清除'{{ else }}'Clear'{{ end }},
      submitButtonTitle: {{ if hasPrefix .Site.Language.Lang "zh" }}'搜索'{{ else }}'Submit'{{ end }},
    },
    onStateChange({ state }) {
      if (state.isOpen) ensureSearchFooter();
    },
    // openOnFocus: true,
    // debug: true,
    navigator: {
      navigate({ itemUrl }) {
        navigate(itemUrl);
      },
    },
    getSources({ query }) {
      return [
        {
          sourceId: 'products',
          getItems() {
            return getAlgoliaResults({
              searchClient,
               queries: [
                {
                  indexName: {{ if hasPrefix .Site.Language.Lang "zh" }}'my-blog-index'{{ else }}'my-blog-index-en'{{ end }},
                  query,
                  params: {
                    hitsPerPage: 5,
                  },
                },
              ],
            });
          },
          templates: {
            item({ item, components, createElement }) {
            //   {
            //     "title": "Projects",
            //     "uri": "projects",
            //     "content": "Book Translation  2020   Modern Javascript impatient",
            //     "objectID": "projects",
            //     "_highlightResult": {
            //         "title": {
            //             "value": "__aa-highlight__P__/aa-highlight__rojects",
            //             "matchLevel": "full",
            //             "fullyHighlighted": false,
            //             "matchedWords": [
            //                 "p"
            //             ]
            //         },
            //         "uri": {
            //             "value": "__aa-highlight__p__/aa-highlight__rojects",
            //             "matchLevel": "full",
            //             "fullyHighlighted": false,
            //             "matchedWords": [
            //                 "p"
            //             ]
            //         },
            //         "content": {
            //             "value": "Book Translation  2020   Modern Javascript impatient",
            //             "matchLevel": "none",
            //             "matchedWords": []
            //         }
            //     },
            //     "__autocomplete_indexName": "my-blog-index",
            //     "__autocomplete_id": 0
            // }
              return createElement(
                'a',
                { className: 'aa-ItemLink', href: buildResultUrl(item) },
                createElement(
                  'div',
                  {
                    className: 'aa-ItemWrapper',
                  },
                  createElement(
                    'div',
                    { className: 'aa-ItemContent' },
                    item.image ? createElement(
                      'div',
                      { className: 'aa-ItemIcon' },
                      createElement('img', {
                        src: item.images[0],
                        alt: item.title,
                        width: 40,
                        height: 40,
                      })
                    ) : null
                  ),
                  createElement(
                    'div',
                    { className: 'aa-ItemContentBody' },
                    createElement(
                      'div',
                      { className: 'aa-ItemContentTitle' },
                      components.Snippet({ hit: item, attribute: 'title' })
                    ),
                    createElement(
                      'div',
                      { className: 'aa-ItemContentDescription' },
                      components.Snippet({ hit: item, attribute: 'description' })
                    )
                  ),
                  createElement(
                    'div',
                    {
                      className: 'aa-ItemActions',
                    },
                    createElement(
                      'button',
                      {
                        className: 'aa-ItemActionButton aa-DesktopOnly aa-ActiveOnly',
                        type: 'button',
                        title: 'Select',
                      },
                      createElement(
                        'svg',
                        {
                          viewBox: '0 0 24 24',
                          width: 20,
                          height: 20,
                          fill: 'currentColor',
                        },
                        createElement('path', {
                          d: 'M18.984 6.984h2.016v6h-15.188l3.609 3.609-1.406 1.406-6-6 6-6 1.406 1.406-3.609 3.609h13.172v-4.031z',
                        })
                      )
                    )
                  )
                )
              );
            },
            noResults() {
              return {{ if hasPrefix .Site.Language.Lang "zh" }}'未找到相关结果'{{ else }}'No results'{{ end }};
            },
          },
          getItemUrl({ item }) {
            return buildResultUrl(item);
          },
        },
      ];
    },
  });

  // Ctrl+K / Cmd+K toggles the search panel; the shortcut is also shown
  // as kbd chips inside the desktop search pill (see main.css).
  document.addEventListener('keydown', (event) => {
    if (event.isComposing || event.shiftKey || event.altKey) return;
    if (!((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k')) return;
    event.preventDefault();
    // Detached mode keeps its open state inside the preset (setIsOpen only
    // drives the dropdown panel), so toggle through the rendered buttons:
    // Cancel closes the modal, the search button opens it.
    const cancel = document.querySelector('.aa-DetachedCancelButton');
    if (cancel) {
      cancel.click();
    } else {
      const button = document.querySelector('#docsearch .aa-DetachedSearchButton');
      if (button) button.click();
    }
  });

  // The bundled autocomplete-js renders no shortcut hint, so append one
  // to the detached search button (platform-aware label). The button is
  // rendered at init; poll briefly in case of a slow first paint.
  (function addShortcutHint(attempts) {
    const button = document.querySelector('#docsearch .aa-DetachedSearchButton');
    if (!button) {
      if (attempts > 0) setTimeout(() => addShortcutHint(attempts - 1), 100);
      return;
    }
    if (button.querySelector('.aa-DetachedSearchButtonShortcut')) return;
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform || '');
    const hint = document.createElement('span');
    hint.className = 'aa-DetachedSearchButtonShortcut';
    hint.setAttribute('aria-hidden', 'true');
    hint.innerHTML = isMac ? '<kbd>⌘</kbd><kbd>K</kbd>' : '<kbd>Ctrl</kbd><kbd>K</kbd>';
    button.appendChild(hint);
    button.setAttribute('aria-keyshortcuts', isMac ? 'Meta+K' : 'Control+K');
  })(20);
</script>
